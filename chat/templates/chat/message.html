{% if msg.role == 'user' %}
<div style="display:flex;justify-content:flex-end;margin-bottom:12px;">
  <div style="max-width:85%;">
    <div style="background:#337ab7;color:#fff;border-radius:16px;padding:10px 14px;white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.5;">{{ msg.content }}</div>
    <small style="color:#aaa;display:block;margin-top:3px;text-align:right;font-size:11px;">{{ msg.created_at }}</small>
  </div>
</div>
{% elif msg.role == 'system' %}
<div style="display:flex;justify-content:flex-start;margin-bottom:12px;">
  <div style="max-width:85%;">
    <div style="background:#e74c3c;color:#fff;border-radius:16px;padding:10px 14px;white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.5;">{{ msg.content }}</div>
    <small style="color:#aaa;display:block;margin-top:3px;font-size:11px;">{{ msg.created_at }}</small>
  </div>
</div>
{% else %}
<div style="display:flex;justify-content:flex-start;margin-bottom:12px;">
  <div style="max-width:85%;">
    <small style="font-weight:bold;display:block;margin-bottom:3px;font-size:12px;
      color:{% if msg.agent == 'annotation' %}#27ae60{% elif msg.agent == 'custom' %}#2980b9{% else %}#8e44ad{% endif %};">
      {{ msg.get_agent_display }}
    </small>
    <div style="background:#fff;border:1px solid #ddd;color:#333;border-radius:16px;padding:10px 14px;white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.5;">{{ msg.content }}</div>
    <small style="color:#aaa;display:block;margin-top:3px;font-size:11px;">{{ msg.created_at }}</small>
  </div>
</div>
{% endif %}
