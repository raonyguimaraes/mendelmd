version: "3.8"
services:
 db:
   image: postgres:15
   volumes:
     - ./data/postgresql_data:/var/lib/postgresql/data/
   restart: always
   environment:
      POSTGRES_PASSWORD: postgres
   healthcheck:
     test: ["CMD-SHELL", "pg_isready -U postgres"]
     interval: 5s
     timeout: 5s
     retries: 10

 web:
   build: .
   command: bash docker-entrypoint.sh
   environment:
     SIGNUP_OPEN: "True"
     ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
   volumes:
     - .:/code
     - /home/raony/dev/pynnotator:/pynnotator
   ports:
     - "127.0.0.1:8002:8000"
   mem_limit: 4g
   restart: always
   depends_on:
     db:
       condition: service_healthy

