{% block extra_css %}
<style>
.app-card {
    display: block;
    text-decoration: none;
    color: inherit;
    margin-bottom: 20px;
}
.app-card:hover .box {
    box-shadow: 0 4px 16px rgba(0,0,0,0.18);
    transform: translateY(-3px);
    transition: all 0.2s ease;
}
.app-card .box {
    transition: all 0.2s ease;
    border-radius: 6px;
}
.app-icon {
    width: 72px;
    height: 72px;
    object-fit: contain;
    margin-bottom: 8px;
}
.app-label {
    font-size: 13px;
    font-weight: 600;
    color: #444;
    margin: 0;
}
</style>
{% endblock %}
